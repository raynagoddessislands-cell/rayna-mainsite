<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>神島玲奈宇宙哲学新要塞 - OMNI EXPANSION DOCK</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #05050a; font-family: 'Helvetica Neue', Arial, sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        
        /* 宇宙哲学サスペンスを煽る高尚なUI */
        .overlay-ui { position: absolute; z-index: 10; color: #ffffff; padding: 30px; pointer-events: none; width: 100%; box-sizing: border-box; }
        .title-panel { border-left: 3px solid #00ffcc; padding-left: 15px; }
        .title { font-size: 24px; font-weight: bold; letter-spacing: 4px; text-shadow: 0 0 10px rgba(0,255,204,0.5); }
        .status { font-size: 11px; color: #00ffcc; opacity: 0.8; margin-top: 5px; font-family: monospace; }
        
        /* 読者を書籍購読へ没頭させるステルス導線 */
        .nav-panel { position: absolute; bottom: 40px; right: 40px; z-index: 10; pointer-events: auto; }
        .btn-subscribe { 
            background: rgba(0, 255, 204, 0.05); border: 1px solid #00ffcc; color: #00ffcc; padding: 15px 40px; 
            font-size: 14px; font-weight: bold; letter-spacing: 2px; cursor: pointer; transition: all 0.3s ease; box-shadow: 0 0 15px rgba(0,255,204,0.1);
        }
        .btn-subscribe:hover { background: #00ffcc; color: #05050a; box-shadow: 0 0 25px #00ffcc; transform: translateY(-2px); }
    </style>
    <!-- 世界標準のWeb3Dライブラリ（Three.js）をCloudflare経由で超高速ロード -->
    <script src="https://cloudflare.com"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <!-- 高尚なゲーミングUI層 -->
    <div class="overlay-ui">
        <div class="title-panel">
            <div class="title">神島玲奈宇宙哲学新要塞：構造ドック</div>
            <div class="status">STATUS: FINAL PHASE UNLEASHED // 3D_SKELETON_ENGINE_ONLINE</div>
        </div>
    </div>

    <div class="nav-panel">
        <button class="btn-subscribe" onclick="initiateSub()">&lt; 頭脳的宇宙の真実を開示する &gt;</button>
    </div>

    <script>
        // 【AI Studio精密削り出し：3D宇宙空間＆スケルトンUFO描画エンジン】
        let scene, camera, renderer, ufoStructure, stars;

        function init() {
            const container = document.getElementById('canvas-container');

            // 1. 時空（シーン）の創生
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x05050a, 0.015);

            // 2. 次元カメラの設置
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 1000);
            camera.position.z = 150;

            // 3. 超電導描画（レンダラー）の起動
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);

            // 4. 星々（波動粒子）の展開
            const starGeometry = new THREE.BufferGeometry();
            const starCount = 1000;
            const starPositions = new Float32Array(starCount * 3);
            for(let i=0; i<starCount*3; i++) {
                starPositions[i] = (Math.random() - 0.5) * 500;
            }
            starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
            const starMaterial = new THREE.PointsMaterial({ color: 0x555588, size: 1.5, sizeAttenuation: true });
            stars = new THREE.Points(starGeometry, starMaterial);
            scene.add(stars);

            // 5. 【唯一無二】オリジナルUFO・多次元同心円スケルトン構造の錬成
            ufoStructure = new THREE.Group();

            // 外周真円フレーム（トラス）
            const ringGeo = new THREE.RingGeometry(45, 50, 6, 1);
            const wireframeGeo = new THREE.WireframeGeometry(ringGeo);
            const lineMat = new THREE.LineBasicMaterial({ color: 0x00ffcc, linewidth: 1 });
            const outerRing = new THREE.LineSegments(wireframeGeo, lineMat);
            outerRing.rotation.x = Math.PI / 2;
            ufoStructure.add(outerRing);

            // 内部多面体コア（Ω級推進機関の骨組み）
            const coreGeo = new THREE.IcosahedronGeometry(20, 1);
            const coreWireframe = new THREE.WireframeGeometry(coreGeo);
            const coreMat = new THREE.LineBasicMaterial({ color: 0x00aaff, linewidth: 1 });
            const innerCore = new THREE.LineSegments(coreWireframe, coreMat);
            ufoStructure.add(innerCore);

            // 波動集束ブリッジ（艦橋フレーム）
            const bridgeGeo = new THREE.ConeGeometry(8, 15, 4, 1, true);
            const bridgeWireframe = new THREE.WireframeGeometry(bridgeGeo);
            const bridgeMat = new THREE.LineBasicMaterial({ color: 0xff00ff, linewidth: 1 });
            const bridge = new THREE.LineSegments(bridgeWireframe, bridgeMat);
            bridge.position.y = 15;
            ufoStructure.add(bridge);

            scene.add(ufoStructure);

            // 6. 環境光の照射
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambientLight);

            // イベントリスナー登録
            window.addEventListener('resize', onWindowResize, false);
            document.addEventListener('mousemove', onMouseMove, false);

            animate();
        }

        // マウスの動きに吸い付く高尚なインタラクション
        let targetX = 0, targetY = 0;
        function onMouseMove(event) {
            targetX = (event.clientX - window.innerWidth / 2) * 0.05;
            targetY = (event.clientY - window.innerHeight / 2) * 0.05;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // 7. 超電導駆動（無限ループアニメーション）
        function animate() {
            requestAnimationFrame(animate);

            // UFOの神秘的な自転
            ufoStructure.rotation.y += 0.005;
            ufoStructure.rotation.z += 0.002;

            // マウスへの滑らかな追従（イナーシャ）
            ufoStructure.position.x += (targetX - ufoStructure.position.x) * 0.05;
            ufoStructure.position.y += (-targetY - ufoStructure.position.y) * 0.05;

            // 背景の星々の微細な流動
            stars.rotation.y += 0.0005;

            renderer.render(scene, camera);
        }

        // 決済城門（Stripe）への接続シミュレーション
        function initiateSub() {
            alert("【改札起動】Cloudflare Workersを通過し、Stripe決済システムへ直結します。提督のePub（2,000円前後）及びUFOスケルトンPDF付録の完全購読ラインを構築中...");
        }

        window.onload = init;
    </script>
</body>
</html>
